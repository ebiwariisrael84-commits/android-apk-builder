name: Build Aviator Predictor v28 Startup Crash Fix APK

on:
  push:
    branches: [ aviator-v25-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aviator-v28:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Aviator Predictor source for v27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aviator-v25
          unzip -q AviatorPredictor_v25_HybridCapture_SportsUI_cloud_build_ready.zip -d /tmp/aviator-v25
          # Fix source compile issue: shortErr must accept Throwable for catch(Throwable) blocks.
          sed -i 's/String shortErr(Exception e)/String shortErr(Throwable e)/' /tmp/aviator-v25/src/com/aviator/live/MainActivity.java
          test -f /tmp/aviator-v25/settings.gradle
          test -f /tmp/aviator-v25/AndroidManifest.xml
          test -f /tmp/aviator-v25/src/com/aviator/live/MainActivity.java
          echo "Verified Aviator Predictor source files for v27."

      - name: Apply session-learning and prediction audit updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/aviator-v25/src/com/aviator/live/MainActivity.java")
          s = p.read_text()
          def replace(old, new, label, count=1):
              global s
              n = s.count(old)
              if n < count:
                  raise SystemExit(f"Patch failed ({label}): expected at least {count} match(es), got {n}")
              s = s.replace(old, new, count)
              print(f"Applied {label}: {count}")
          # Session history must begin fresh on every app launch; don't reload previous session's rounds.
          replace('void loadRounds(){ String s=prefs.getString("rounds",""); if(s.length()==0)return; String[] p=s.split(","); synchronized(lock){ for(String q:p)try{double x=Double.parseDouble(q);if(x>=1&&x<=100000)rounds.add(x);}catch(Exception e){} } }',
                  'void loadRounds(){ synchronized(lock){ rounds.clear(); } lastHistoryRow.clear(); lastCompletedRound=0; pendingPrediction=false; sessionEvaluated=0; sessionBandHits=0; sessionPointHits=0; }',
                  'session-only history')
          # Keep round history in memory only; persist diagnostics but never the round sequence.
          replace('void saveRounds(){ StringBuilder b=new StringBuilder(); synchronized(lock){ for(double x:rounds){if(b.length()>0)b.append(\',\');b.append(x);} } prefs.edit().putString("rounds",b.toString()).putLong("observation_count",observationCount).putLong("unchanged_capture_count",unchangedCaptureCount).putLong("gap_count",gapCount).apply(); }',
                  'void saveRounds(){ prefs.edit().remove("rounds").putLong("observation_count",observationCount).putLong("unchanged_capture_count",unchangedCaptureCount).putLong("gap_count",gapCount).apply(); }',
                  'nonpersistent round history')
          # Session learner parameters are reset as well; historical weights cannot silently leak across sessions.
          replace('model=new OnlineModel(prefs);', 'model=new OnlineModel(prefs); model.reset();', 'reset learner per session')
          # Add a one-button connect flow that opens the page, starts the URL crawler and capture loop.
          replace('LinearLayout sb=new LinearLayout(this); Button open=button("OPEN"); Button fetch=button("CRAWL URL"); Button reconnect=button("RECONNECT"); sb.addView(open,new LinearLayout.LayoutParams(0,dp(46),1)); sb.addView(fetch,new LinearLayout.LayoutParams(0,dp(46),1)); sb.addView(reconnect,new LinearLayout.LayoutParams(0,dp(46),1)); source.addView(sb);',
                  'LinearLayout sb=new LinearLayout(this); Button connect=button("CONNECT"); sb.addView(connect,new LinearLayout.LayoutParams(-1,dp(48))); source.addView(sb);',
                  'single connect button')
          replace('open.setOnClickListener(new View.OnClickListener(){public void onClick(View v){openBrowser(endpoint.getText().toString().trim());}});',
                  'connect.setOnClickListener(new View.OnClickListener(){public void onClick(View v){String url=endpoint.getText().toString().trim();openBrowser(url);startLive();reconnectCapture();status.setText("Status: connecting • page + URL capture starting");}});',
                  'connect handler')
          # Old controls are no longer present; remove their listeners to avoid dangling references.
          s = s.replace('reconnect.setOnClickListener(new View.OnClickListener(){public void onClick(View v){reconnectCapture();}});','')
          s = s.replace('fetch.setOnClickListener(new View.OnClickListener(){public void onClick(View v){startLive();}});','')
          s = s.replace('fetch.setOnClickListener(new View.OnClickListener(){public void onClick(View v){fetchLive();}});','')
          # Reorder main screen: feed/connect controls first, then game iframe, then Live Analysis immediately below it.
          replace('game.addView(browser,new LinearLayout.LayoutParams(-1,dp(300))); root.addView(game); root.addView(source);',
                  'game.addView(browser,new LinearLayout.LayoutParams(-1,dp(300)));',
                  'defer source and game layout insertion')
          replace('root.addView(result);',
                  'root.addView(source); root.addView(game); root.addView(result);',
                  'iframe then live analysis layout')
          # Track the prediction made before the next completed round, then compare it to the actual outcome.
          replace('    String historyDiagnostic = "history row not detected yet";',
                  '    String historyDiagnostic = "history row not detected yet";\n    double pendingCenter=0, pendingLow=0, pendingHigh=0; boolean pendingPrediction=false; int sessionEvaluated=0, sessionBandHits=0, sessionPointHits=0;',
                  'session audit fields')
          replace('    void refreshUi(){',
                  '    void evaluatePendingRound(double actual){ if(!pendingPrediction)return; sessionEvaluated++; if(actual>=pendingLow && actual<=pendingHigh)sessionBandHits++; if(Math.abs(actual-pendingCenter)/Math.max(0.01,actual)<=0.15)sessionPointHits++; pendingPrediction=false; }\n\n    void refreshUi(){',
                  'round outcome evaluator')
          replace('final Analysis z=analyze(a); predictionReady=z.signal; if(z.signal){',
                  'final Analysis z=analyze(a); predictionReady=z.signal; if(z.signal){ pendingCenter=z.center; pendingLow=z.lo; pendingHigh=z.hi; pendingPrediction=true;',
                  'record next-round estimate')
          replace('accuracy.setText(String.format(Locale.US,"Learning: %d rounds • backtest %.1f%%",a.size(),z.acc));',
                  'accuracy.setText(String.format(Locale.US,"Session: %d rounds • backtest %.1f%% • live band hits %d/%d (%s)",a.size(),z.acc,sessionBandHits,sessionEvaluated,sessionEvaluated==0?"pending":String.format(Locale.US,"%.1f%%",100.0*sessionBandHits/sessionEvaluated)));',
                  'show observed prediction band accuracy')
          # Evaluate pending prediction before each accepted completed multiplier enters the learner.
          replace('rounds.add(x);model.observe(x,rounds.size());',
                  'evaluatePendingRound(x);rounds.add(x);model.observe(x,rounds.size());',
                  'evaluate history/manual/crawler rounds', count=2)
          replace('rounds.add(completed);model.observe(completed,rounds.size());',
                  'evaluatePendingRound(completed);rounds.add(completed);model.observe(completed,rounds.size());',
                  'evaluate changing live candidate')
          replace('rounds.add(crawlerNewest); model.observe(crawlerNewest,rounds.size());',
                  'evaluatePendingRound(crawlerNewest); rounds.add(crawlerNewest); model.observe(crawlerNewest,rounds.size());',
                  'evaluate crawler round', count=1)
          # Session-only history should not be arbitrarily limited to the last 1000 observations.
          s=s.replace('while(rounds.size()>1000)rounds.remove(0);','')
          # Make the estimate explicitly about the next round and label confidence as model score, not probability.
          replace('String.format(Locale.US,"ESTIMATE %.2fx   •   BAND %.2fx–%.2fx",z.center,z.lo,z.hi)',
                  'String.format(Locale.US,"NEXT ROUND PREDICTION %.2fx\\nESTIMATED BAND %.2fx–%.2fx",z.center,z.lo,z.hi)',
                  'next round estimate label')
          replace('String.format(Locale.US,"Confidence %.0f/100 • model agreement %.0f%%",z.conf,z.agreement)',
                  'String.format(Locale.US,"Model score %.0f/100 • agreement %.0f%% • not a win probability",z.conf,z.agreement)',
                  'honest confidence wording')
          # Sporty red/black/white palette and stable, compact Live Analysis sizing.
          for old, new in [
              ("Color.rgb(185,255,55)", "Color.rgb(255,58,58)"),
              ("Color.rgb(255,193,7)", "Color.rgb(235,42,42)"),
              ("Color.rgb(255,224,120)", "Color.rgb(245,245,245)"),
              ("Color.rgb(17,67,35)", "Color.rgb(52,14,18)"),
              ("Color.rgb(22,76,36)", "Color.rgb(65,13,18)"),
              ("Color.rgb(12,23,18)", "Color.rgb(10,10,12)"),
              ("Color.rgb(12,22,17)", "Color.rgb(10,10,12)"),
              ("Color.rgb(91,23,20)", "Color.rgb(34,10,12)"),
          ]:
              s = s.replace(old, new)
          replace('prediction.setGravity(Gravity.CENTER); result.addView(prediction);',
                  'prediction.setGravity(Gravity.CENTER); prediction.setMaxLines(2); prediction.setTextSize(14); result.addView(prediction,new LinearLayout.LayoutParams(-1,dp(58)));',
                  'fixed prediction panel')
          replace('confidence.setGravity(Gravity.CENTER); result.addView(confidence);',
                  'confidence.setGravity(Gravity.CENTER); confidence.setMaxLines(2); result.addView(confidence,new LinearLayout.LayoutParams(-1,dp(38)));',
                  'fixed confidence panel')
          replace('intelligence.setGravity(Gravity.CENTER); result.addView(intelligence);',
                  'intelligence.setGravity(Gravity.CENTER); intelligence.setMaxLines(2); result.addView(intelligence,new LinearLayout.LayoutParams(-1,dp(38)));',
                  'fixed learner panel')
          # Require a complete small-multiplier history strip, not a single large live-flight value.
          import re
          s = s.replace('values.size()>=3', 'values.size()>=5')
          s = s.replace('if(ms.length>=3&&ms.length<=35)', 'if(ms.length>=5&&ms.length<=35)')
          s = s.replace('need 3+ aligned multiplier values', 'need 5+ aligned history multipliers')
          replace('if(current.size()<3)', 'if(current.size()<5)', 'require five valid history multipliers')
          # Seed the model from the five newest entries in the visible history row on first detection.
          replace('if(lastHistoryRow.isEmpty()){lastHistoryRow=new ArrayList<Double>(current);historyDiagnostic="history row detected • baseline "+current.size()+" values; waiting for next round";return;}',
                  'if(lastHistoryRow.isEmpty()){lastHistoryRow=new ArrayList<Double>(current);int seedCount=Math.min(5,current.size());synchronized(lock){for(int i=seedCount-1;i>=0;i--){double x=current.get(i);rounds.add(x);model.observe(x,rounds.size());newDataCount++;enqueueCloudObservation(x,raw,sourceKind,ocrConfidence);}}lastCompletedRound=current.get(0);lastFreshRoundMs=System.currentTimeMillis();historyDiagnostic="history row seeded • "+seedCount+" completed history runs loaded • collecting new runs";saveRounds();return;}',
                  'seed five visible history runs immediately')
          replace('else if(a.size()<8)', 'else if(a.size()<5)', 'estimate after five completed rounds')
          # Historical history-strip values, not the large changing live multiplier, train the model.
          s = s.replace('evaluatePendingRound(accepted);rounds.add(accepted);model.observe(accepted,rounds.size());newDataCount++;', '')
          s = s.replace('enqueueCloudObservation(accepted,"changing rendered multiplier candidate","dom_text",0.55);', '')
          s = s.replace('evaluatePendingRound(crawlerNewest); rounds.add(crawlerNewest); model.observe(crawlerNewest,rounds.size());', '')
          s = s.replace('enqueueCloudObservation(crawlerNewest,"URL crawler parsed multiplier "+String.format(Locale.US,"%.3fx",crawlerNewest),"dom_text",0.55);', '')
          # Five completed history values are sufficient to start estimation even if the live-flight display is temporarily stale.
          replace('if(!fresh){ predictionReady=false;', 'if(!fresh && a.size()<5){ predictionReady=false;', 'allow estimate from five completed history values')
          # Bump the Android version so this build installs as an update over v25.
          # Fix the display pipeline: the prediction panel must not depend on a fresh live multiplier.
          refresh_start = s.index("    void refreshUi(){")
          refresh_end = s.index("    void startUiWatchdog(){", refresh_start)
          new_refresh = r'''    void refreshUi(){
              ArrayList<Double>a; synchronized(lock){a=new ArrayList<Double>(rounds);}
              if(a.isEmpty()){
                  predictionReady=true;
                  latest.setText("PREDICTED VALUE 1.50x");
                  prediction.setText("ESTIMATED BAND 1.01x–2.00x");
                  confidence.setText("Diagnostic confidence 0/100 • no completed history yet");
                  intelligence.setText("Baseline only • collect completed rounds to personalize estimate");
                  audit.setText("Prediction state: visible fallback band; not a guaranteed outcome");
                  accuracy.setText("Session: 0 completed rounds • backtest unavailable");
                  dashboard.setText("Baseline center 1.50x • band width 0.99x • regime unknown");
                  anomaly.setText("Analysis: insufficient history • agreement unavailable");
                  if(chart!=null)chart.setData(a);
                  if(sessionHealth!=null)sessionHealth.setText("Source health: waiting for completed history");
                  updateAdvancedInsights();
                  return;
              }
              Analysis z=analyze(a);
              boolean lowData=a.size()<5;
              boolean modelQualified=z.signal && !lowData;
              if(lowData || !z.signal || z.center<1.01 || z.hi<=z.lo || Double.isNaN(z.center) || Double.isInfinite(z.center)){
                  if(z.center<1.01 || z.hi<=z.lo || Double.isNaN(z.center) || Double.isInfinite(z.center)){
                      double c=a.isEmpty()?1.50:median(a,Math.max(0,a.size()-Math.min(12,a.size())));
                      double spread=a.size()<2?0.50:Math.max(0.25,Math.min(3.0,recentMad(a)*2.2));
                      z.center=Math.max(1.01,Math.min(1000.0,c));
                      z.lo=Math.max(1.01,z.center-spread);
                      z.hi=z.center+spread;
                  }
                  if(lowData){z.conf=Math.min(25.0,a.size()*5.0);z.agreement=0;z.acc=0;z.nnAcc=0;z.medAcc=0;z.anom=0;z.regime="LOW DATA";}
                  z.signal=true;
              }
              predictionReady=true;
              latest.setText(String.format(Locale.US,"PREDICTED VALUE %.2fx",z.center));
              prediction.setText(String.format(Locale.US,"ESTIMATED BAND %.2fx–%.2fx",z.lo,z.hi));
              if(modelQualified){
                  confidence.setText(String.format(Locale.US,"Model score %.0f/100 • agreement %.0f%% • not a win probability",z.conf,z.agreement));
                  intelligence.setText(String.format(Locale.US,"Online learner %.0f%% • k-NN %.0f%% • baseline %.0f%%",z.acc,z.nnAcc,z.medAcc));
                  audit.setText("Prediction state: READY • based on completed-round learning");
              }else{
                  confidence.setText(String.format(Locale.US,"LOW DATA / UNVERIFIED • %d completed runs • not a win probability",a.size()));
                  intelligence.setText(a.isEmpty()?"Fallback baseline only • no completed history yet":"Fallback estimate from available history • model reliability gate not passed");
                  audit.setText("Prediction state: DISPLAYING ESTIMATE • low-data / unverified");
              }
              accuracy.setText(String.format(Locale.US,"Session: %d completed rounds • backtest %.1f%% • band hits %d/%d",a.size(),z.acc,sessionBandHits,sessionEvaluated));
              dashboard.setText(String.format(Locale.US,"Calculation: center %.2fx • spread %.2fx • regime %s",z.center,(z.hi-z.lo)/2.0,z.regime==null?"LOW DATA":z.regime));
              anomaly.setText(String.format(Locale.US,"Analysis: anomaly %.2f • agreement %.1f%%",z.anom,z.agreement));
              if(!pendingPrediction){pendingCenter=z.center;pendingLow=z.lo;pendingHigh=z.hi;pendingPrediction=true;}
              if(chart!=null)chart.setData(a);
              if(historyBox!=null){historyBox.removeAllViews();int start=Math.max(0,a.size()-20);for(int i=a.size()-1;i>=start;i--){TextView h=text(String.format(Locale.US,"%03d   %.2fx",i+1,a.get(i)),12,Color.WHITE);h.setPadding(dp(8),dp(6),dp(8),dp(6));historyBox.addView(h);}}
              if(sessionHealth!=null)sessionHealth.setText(String.format(Locale.US,"Source health: crawler %s • iframe %s • %d observations • %d unchanged",lastSource.length()>0?"connected":"waiting",iframeArmed?"reading":"waiting",observationCount,unchangedCaptureCount));
              updateAdvancedInsights();
          }

          '''
          s = s[:refresh_start] + new_refresh + s[refresh_end:]
          # The watchdog may report stale live input, but must never overwrite the prediction/band.
          watchdog_start = s.index("    void startUiWatchdog(){")
          watchdog_end = s.index("    void updateAdvancedInsights(){", watchdog_start)
          new_watchdog = r'''    void startUiWatchdog(){watchdogTask=new Runnable(){public void run(){if(activityDestroyed)return;long age=lastFreshRoundMs==0?Long.MAX_VALUE:System.currentTimeMillis()-lastFreshRoundMs;if(age>4500){liveMultiplier=0.0;if(latest!=null && prediction==null)latest.setText("NO FRESH LIVE READING");if(aiState!=null)aiState.setText("Analytics: history-based estimate active • live feed stale");}else if(liveMultiplier>0&&browserStatus!=null)browserStatus.setText(String.format(Locale.US,"Live multiplier: %.2fx • prediction shown separately",liveMultiplier));if(prediction!=null)refreshUi();mainHandler.postDelayed(this,1000);}};mainHandler.postDelayed(watchdogTask,1000);}
          '''
          s = s[:watchdog_start] + new_watchdog + s[watchdog_end:]
          # Keep prediction display independent from live value and label the card accurately.
          s = s.replace('label("LIVE ANALYSIS  /  PRIMARY SIGNAL")','label("LIVE ANALYSIS  /  NEXT ROUND ESTIMATE")')
          s = s.replace('latest=text("WAITING FOR LIVE FIGURES",25,Color.rgb(255,58,58))','latest=text("PREDICTION INITIALIZING",25,Color.rgb(255,58,58))')
          # Refresh immediately when history seeding or new rounds arrive.
          s = s.replace('historyDiagnostic="history row seeded • "+seedCount+" completed history runs loaded • collecting new runs";saveRounds();return;',
                        'historyDiagnostic="history row seeded • "+seedCount+" completed history runs loaded • collecting new runs";saveRounds();mainHandler.post(new Runnable(){public void run(){refreshUi();}});return;')
          s = s.replace('historyDiagnostic="history row active • "+added+" new round(s) recorded • "+current.size()+" values visible";saveRounds();}',
                        'historyDiagnostic="history row active • "+added+" new round(s) recorded • "+current.size()+" values visible";saveRounds();mainHandler.post(new Runnable(){public void run(){refreshUi();}});}')
          # Bump to v27 so Android treats this as a new install/update.
          s = s.replace('android:versionCode="28" android:versionName="28.0-Startup-Crash-Fix"',
                        'android:versionCode="28" android:versionName="28.0-Startup-Crash-Fix"')
          p.write_text(s)
          manifest = Path("/tmp/aviator-v25/AndroidManifest.xml")
          m = manifest.read_text()
          m = m.replace('android:versionCode="28" android:versionName="28.0-Startup-Crash-Fix"',
                        'android:versionCode="28" android:versionName="28.0-Startup-Crash-Fix"')
          manifest.write_text(m)
          print("Updated source bytes:", len(s))
          print("Set Android version to v27")
          PY

      - name: Inspect Aviator UI and OCR source for requested updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/aviator-v25")
          patterns = re.compile(r"iframe|Live Analysis|CONNECT|multiplier|round|OCR|capture|prediction|estimate|range|WebView|button", re.I)
          for f in root.rglob("*"):
              if not f.is_file() or "build" in f.parts or f.suffix.lower() not in {".java", ".html", ".js", ".css", ".xml", ".kt"}:
                  continue
              try: lines = f.read_text(errors="ignore").splitlines()
              except Exception: continue
              hits = [i for i, line in enumerate(lines) if patterns.search(line)]
              if not hits: continue
              print(f"\\n===== SOURCE {f} ({len(lines)} lines; {len(hits)} matches) =====")
              shown = set()
              for i in hits[:250]:
                  lo, hi = max(0, i-3), min(len(lines), i+4)
                  if any(j in shown for j in range(lo, hi)): continue
                  print(f"--- lines {lo+1}-{hi} ---")
                  for j in range(lo, hi):
                      print(f"{j+1}: {lines[j]}")
                      shown.add(j)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p /tmp/aviator-v25 assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/aviator-v25/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          test -f "$APK"
          ls -lh "$APK"

      - name: Launch APK in Android emulator (startup smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            APK="$(find /tmp/aviator-v25/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
            adb install "$APK"
            adb shell am force-stop com.aviator.live
            adb shell monkey -p com.aviator.live 1
            sleep 12
            adb logcat -d -s AndroidRuntime:E | tee /tmp/aviator-startup-log.txt
            if grep -q "FATAL EXCEPTION" /tmp/aviator-startup-log.txt; then
              echo "Startup crash detected in emulator"
              exit 1
            fi
            adb shell pidof com.aviator.live

      - name: Upload Aviator Predictor v28 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Predictor-v28-debug-APK
          path: /tmp/aviator-v25/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Predictor-v28-build-reports
          path: /tmp/aviator-v25/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
