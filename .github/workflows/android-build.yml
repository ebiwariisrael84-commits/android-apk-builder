name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Supabase build configuration
      shell: bash
      run: |
        test -n "$SUPABASE_URL" || { echo "Missing repository secret SUPABASE_URL"; exit 1; }
        test -n "$SUPABASE_ANON_KEY" || { echo "Missing repository secret SUPABASE_ANON_KEY"; exit 1; }
        case "$SUPABASE_URL" in https://*.supabase.co) echo "Supabase URL format looks valid." ;; *) echo "SUPABASE_URL must be the HTTPS project URL ending in .supabase.co"; exit 1 ;; esac

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Gradle 8.0
      run: |
        curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.0-bin.zip --output /tmp/gradle-8.0-bin.zip
        unzip -q /tmp/gradle-8.0-bin.zip -d /tmp
        echo "/tmp/gradle-8.0/bin" >> "$GITHUB_PATH"

    - name: Build with Gradle
      run: gradle build -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Build Debug APK
      run: gradle assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Build Release APK
      run: gradle assembleRelease -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: app/build/reports/