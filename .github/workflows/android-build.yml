name: Build Aviator Predictor v25 APK

on:
  push:
    branches: [ aviator-v25-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aviator-v25:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Aviator Predictor v25 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aviator-v25
          unzip -q AviatorPredictor_v25_HybridCapture_SportsUI_cloud_build_ready.zip -d /tmp/aviator-v25
          test -f /tmp/aviator-v25/settings.gradle
          test -f /tmp/aviator-v25/AndroidManifest.xml
          test -f /tmp/aviator-v25/src/com/aviator/live/MainActivity.java
          echo "Verified Aviator Predictor v25 source files."

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p /tmp/aviator-v25 assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/aviator-v25/build/outputs/apk/debug/$(find /tmp/aviator-v25/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -printf '%f\n' | head -n 1)
          test -f "$APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Aviator Predictor v25 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Predictor-v25-debug-APK
          path: /tmp/aviator-v25/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Predictor-v25-build-reports
          path: /tmp/aviator-v25/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
